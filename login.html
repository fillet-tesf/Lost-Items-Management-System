<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Login | LIMS</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- ========== NAVBAR ========== -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">LIMS</a>
        </div>
    </nav>

    <!-- ========== LOGIN FORM ========== -->
    <div class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="card shadow p-4 login-card">
            <h3 class="text-center mb-4">Login</h3>

            <form id="loginForm" novalidate>
                <div class="mb-3">
                    <label class="form-label">Email or Phone</label>
                    <input id="loginEmailOrPhone" type="text" class="form-control" placeholder="Enter email or phone">
                </div>

                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input id="loginPassword" type="password" class="form-control" placeholder="Enter password">
                </div>

                <div class="d-grid">
                    <button type="submit" class="btn btn-primary">Login</button>
                </div>
            </form>

            <p class="text-center mt-3">
                Don’t have an account?
                <a href="signup.html">Sign up</a>
            </p>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="jquery-4.0.0.js"></script>
    <script src="js/main.js"></script>

</body>

</html>
