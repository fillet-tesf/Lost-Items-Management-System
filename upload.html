<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Report Item | LIMS</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- ========== NAVBAR ========== -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">LIMS</a>
        </div>
    </nav>

    <!-- ========== UPLOAD FORM ========== -->
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card shadow p-4 upload-card">

                    <h3 class="text-center mb-4">Report Lost / Found Item</h3>

                    <form id="uploadForm" novalidate>

                        <!-- Item Type -->
                        <div class="mb-3">
                            <label class="form-label">Item Type</label>
                            <select id="itemType" class="form-select">
                                <option value="">Select item type</option>
                                <option value="lost">Lost</option>
                                <option value="found">Found</option>
                            </select>
                            <div class="invalid-feedback">
                                Please select item type.
                            </div>
                        </div>

                        <!-- Item Name -->
                        <div class="mb-3">
                            <label class="form-label">Item Name</label>
                            <input id="itemName" type="text" class="form-control" placeholder="e.g. Mobile Phone">
                            <div class="invalid-feedback">
                                Item name is required.
                            </div>
                        </div>

                        <!-- Category -->
                        <div class="mb-3">
                            <label class="form-label">Category</label>
                            <select id="category" class="form-select">
                                <option value="">Select category</option>
                                <option>Phone</option>
                                <option>ID Card</option>
                                <option>Wallet</option>
                                <option>Document</option>
                                <option>Other</option>
                            </select>
                            <div class="invalid-feedback">
                                Please select a category.
                            </div>
                        </div>

                        <!-- Location (DROPDOWN – fixed) -->
                        <div class="mb-3">
                            <label class="form-label">Location</label>
                            <select id="location" class="form-select">
                                <option value="">Select location</option>
                                <option>Main Campus</option>
                                <option>Library</option>
                                <option>Cafeteria</option>
                                <option>Main Gate</option>
                                <option>Dormitory</option>
                            </select>
                            <div class="invalid-feedback">
                                Please select a location.
                            </div>
                        </div>

                        <!-- Date -->
                        <div class="mb-3">
                            <label class="form-label">Date</label>
                            <input id="date" type="date" class="form-control">
                            <div class="invalid-feedback">
                                Please select a date.
                            </div>
                        </div>

                        <!-- Description -->
                        <div class="mb-3">
                            <label class="form-label">Description</label>
                            <textarea id="description" class="form-control" rows="3"
                                placeholder="Add more details about the item"></textarea>
                            <div class="invalid-feedback">
                                Description is required.
                            </div>
                        </div>

                        <!-- Image Upload (optional) -->
                        <div class="mb-3">
                            <label class="form-label">Upload Image (optional)</label>
                            <input type="file" class="form-control">
                        </div>

                        <!-- Submit -->
                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary btn-lg">
                                Submit
                            </button>
                        </div>

                    </form>

                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- jQuery -->
    <script src="jquery-4.0.0.js"></script>

    <!-- Custom JS -->
    <script src="js/main.js"></script>

</body>

</html>
