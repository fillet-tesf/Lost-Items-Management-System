<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Success | LIMS</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-light">

    <div class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="card shadow text-center p-5 success-card">

            <div class="mb-3">
                <span class="display-1 text-success">✔</span>
            </div>

            <h3 class="mb-3">Submission Successful</h3>

            <p id="successMessage" class="lead">
                Your item has been successfully submitted.
            </p>

            <a href="index.html" class="btn btn-primary mt-3">
                Return to Home
            </a>

        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- jQuery -->
    <script src="js/jquery-4.0.0.js"></script>

    <script>
        // Read item type from URL
        const params = new URLSearchParams(window.location.search);
        const type = params.get("type");

        if (type === "lost") {
            $("#successMessage").text("Your LOST item has been successfully submitted.");
        } else if (type === "found") {
            $("#successMessage").text("Your FOUND item has been successfully submitted.");
        }
    </script>

</body>

</html>
