<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>User Dashboard | LIMS</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/dashboard.css">
</head>

<body>

    <!-- Mobile Toggle Button -->
    <button class="mobile-toggle" id="mobileToggle">
        <i class="bi bi-list fs-5"></i>
    </button>

    <!-- Sidebar Overlay -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <div class="d-flex">

        <!-- SIDEBAR -->
        <div class="sidebar p-3" id="sidebar">
            <h4 class="text-white">
                <i class="bi bi-shield-check me-2"></i>LIMS
            </h4>
            <hr class="text-white">

            <ul class="nav flex-column">
                <li class="nav-item">
                    <a class="nav-link active" data-page="user-overview" href="#">
                        <i class="bi bi-speedometer2"></i> Dashboard
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" data-page="my-items" href="#">
                        <i class="bi bi-box-seam"></i> My Items
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" data-page="claimed-items" href="#">
                        <i class="bi bi-check2-circle"></i> Claimed Items
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" data-page="matches" href="#">
                        <i class="bi bi-arrows-alt-h"></i> Matches
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" data-page="notifications" href="#">
                        <i class="bi bi-bell"></i> Notifications
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="wallet.html">
                        <i class="bi bi-wallet2"></i> Wallet
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" data-page="profile" href="#">
                        <i class="bi bi-person-circle"></i> Profile
                    </a>
                </li>
            </ul>
        </div>

        <!-- CONTENT -->
        <div class="content p-4" id="dashboardContent">

            <div class="d-flex justify-content-between mb-4">
                <h3>Welcome back, <span id="welcomeName"></span></h3>
                <a href="upload.html" class="btn btn-primary">Report New Item</a>
            </div>

            <div class="row g-3 mb-4">
                <div class="col-md-3">
                    <div class="card stat-card stat-card-primary">
                        <div class="stat-icon me-3">
                            <i class="bi bi-file-earmark-text"></i>
                        </div>
                        <div>
                            <h6 class="text-muted mb-0">Total Reported</h6>
                            <h3 class="fw-bold mb-0">12</h3>
                        </div>
                    </div>
                </div>

                <div class="col-md-3">
                    <div class="card stat-card stat-card-success">
                        <div class="stat-icon me-3">
                            <i class="bi bi-link-45deg"></i>
                        </div>
                        <div>
                            <h6 class="text-muted mb-0">Matches</h6>
                            <h3 class="fw-bold mb-0">3</h3>
                        </div>
                    </div>
                </div>

                <div class="col-md-3">
                    <div class="card stat-card stat-card-warning">
                        <div class="stat-icon me-3">
                            <i class="bi bi-hourglass-split"></i>
                        </div>
                        <div>
                            <h6 class="text-muted mb-0">Pending</h6>
                            <h3 class="fw-bold mb-0">2</h3>
                        </div>
                    </div>
                </div>

                <div class="col-md-3">
                    <div class="card stat-card stat-card-info">
                        <div class="stat-icon me-3">
                            <i class="bi bi-check2-circle"></i>
                        </div>
                        <div>
                            <h6 class="text-muted mb-0">Claimed</h6>
                            <h3 class="fw-bold mb-0">7</h3>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card p-3">
                <h5>Recent Items</h5>

                <table class="table mt-3">
                    <thead>
                        <tr>
                            <th>Item</th>
                            <th>Category</th>
                            <th>Location</th>
                            <th>Status</th>
                        </tr>
                    </thead>

                    <tbody id="myItemsTable">

                    </tbody>
                </table>
            </div>

        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/dashboard.js"></script>

    <script>
        $(document).ready(function () {
            const mobileToggle = $('#mobileToggle');
            const sidebar = $('#sidebar');
            const overlay = $('#sidebarOverlay');

            // Toggle sidebar on mobile
            mobileToggle.on('click', function () {
                sidebar.toggleClass('active');
                overlay.toggleClass('active');
            });

            // Close sidebar when clicking overlay
            overlay.on('click', function () {
                sidebar.removeClass('active');
                overlay.removeClass('active');
            });

            // Close sidebar when clicking a nav link on mobile
            $('.sidebar .nav-link').on('click', function () {
                if ($(window).width() < 768) {
                    sidebar.removeClass('active');
                    overlay.removeClass('active');
                }
            });

            // Handle window resize
            $(window).on('resize', function () {
                if ($(window).width() >= 768) {
                    sidebar.removeClass('active');
                    overlay.removeClass('active');
                }
            });
        });
    </script>

</body>

</html>
