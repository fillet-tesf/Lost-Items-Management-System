<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Edit Item | LIMS</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <div class="container mt-5">
        <div class="card shadow p-4">
            <h3 class="mb-4">Edit Item</h3>

            <form id="editItemForm">

                <div class="mb-3">
                    <label class="form-label">Title</label>
                    <input type="text" id="title" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Description</label>
                    <textarea id="description" class="form-control" required></textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label">Category</label>
                    <input type="text" id="categoryName" class="form-control" readonly>
                </div>

                <div class="mb-3">
                    <label class="form-label">Location</label>
                    <input type="text" id="locationName" class="form-control" readonly>
                </div>

                <div class="mb-3" id="dateContainer"></div>

                <button class="btn btn-primary">Update Item</button>
                <a href="user-dashboard.html" class="btn btn-secondary">Cancel</a>

            </form>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/ui.js"></script>

    <script>
        const params = new URLSearchParams(window.location.search);
        const itemId = params.get("id");

        const token = localStorage.getItem("token");
        const currentUser = JSON.parse(localStorage.getItem("user") || "{}");

        if (!token) {
            window.location.href = "login.html";
        }

        function showToast(message, type = "info") {
            if (window.LIMS_UI && window.LIMS_UI.showToast) {
                window.LIMS_UI.showToast(message, type);
                return;
            }
            console.log(message);
        }

        function setButtonLoading($button, label) {
            if (window.LIMS_UI && window.LIMS_UI.setButtonLoading) {
                return window.LIMS_UI.setButtonLoading($button, label);
            }
            const originalText = $button.text();
            $button.prop("disabled", true).text(label);
            return function restore() {
                $button.prop("disabled", false).text(originalText);
            };
        }

        $("#dateContainer").html(`
            <div class="text-muted py-2">
                <div class="spinner-border spinner-border-sm me-2"></div>Loading item details...
            </div>
        `);

        // Load item
        $.ajax({
            url: window.location.origin + "/items/" + itemId,
            method: "GET",
            headers: {
                Authorization: "Bearer " + token
            },
            success: function (item) {

                $("#title").val(item.title);
                $("#description").val(item.description);

                $("#categoryName").val(item.category);
                $("#locationName").val(item.location);

                if (item.item_type === "lost") {
                    $("#dateContainer").html(`
        <label class="form-label">Lost Date</label>
        <input class="form-control" value="${item.lost_date ? item.lost_date.split("T")[0] : ""}" readonly >
      `);
                } else {
                    $("#dateContainer").html(`
        <label class="form-label">Found Date</label>
        <input class="form-control" value="${item.found_date ? item.found_date.split("T")[0] : ""}" readonly >
        `);
                }
            }
        });

        // Update item
        $("#editItemForm").submit(function (e) {
            e.preventDefault();
            const $submitButton = $(this).find('button[type="submit"]').first();
            const restoreButton = setButtonLoading($submitButton, "Updating...");

            $.ajax({
                url: window.location.origin + "/items/" + itemId,
                method: "PUT",
                headers: {
                    Authorization: "Bearer " + token,
                    "Content-Type": "application/json"
                },
                data: JSON.stringify({
                    title: $("#title").val(),
                    description: $("#description").val()
                }),
                success: function () {
                    showToast("Item updated successfully", "success");
                    window.location.href = currentUser.role === "admin"
                        ? "admin-dashboard.html"
                        : "user-dashboard.html";
                },
                error: function () {
                    showToast("Failed to update item", "error");
                },
                complete: function () {
                    restoreButton();
                }
            });
        });
    </script>

</body>

</html>
