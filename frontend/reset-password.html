<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Reset Password | LIMS</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">LIMS</a>
        </div>
    </nav>

    <div class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="card shadow p-4 login-card">
            <h3 class="text-center mb-3">Reset Password</h3>
            <p class="text-muted text-center" id="resetPasswordHelpText">Choose a new password for your account.</p>

            <form id="resetPasswordForm" novalidate>
                <input id="resetPasswordToken" type="hidden">
                <div class="mb-3">
                    <label class="form-label">New Password</label>
                    <input id="resetPasswordNew" type="password" class="form-control" placeholder="Enter new password">
                </div>
                <div class="mb-3">
                    <label class="form-label">Confirm New Password</label>
                    <input id="resetPasswordConfirm" type="password" class="form-control" placeholder="Confirm new password">
                </div>
                <div class="d-grid">
                    <button type="submit" class="btn btn-primary">Reset Password</button>
                </div>
            </form>

            <p class="text-center mt-3 mb-0">
                <a href="login.html">Back to Login</a>
            </p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/jquery-4.0.0.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/main.js"></script>
</body>

</html>
