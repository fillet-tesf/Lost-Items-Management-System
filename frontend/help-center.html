<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Help Center | LIMS AI Support</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .help-shell { max-width: 980px; margin: 0 auto; }
    .chat-card { border: 0; border-radius: 18px; overflow: hidden; }
    .chat-header { background: linear-gradient(135deg, #0d6efd, #3b82f6); color: #fff; }
    .chat-body { height: 58vh; min-height: 380px; overflow-y: auto; background: #f8fafc; }
    .message-row { display: flex; margin-bottom: 14px; }
    .message-row.user { justify-content: flex-end; }
    .bubble {
      max-width: 78%;
      padding: 12px 14px;
      border-radius: 14px;
      box-shadow: 0 3px 14px rgba(2, 6, 23, 0.06);
      line-height: 1.45;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    .bubble.assistant { background: #fff; border: 1px solid #e8eef7; }
    .bubble.user { background: #0d6efd; color: #fff; }
    .meta { font-size: 0.76rem; opacity: 0.75; margin-top: 6px; }
    .quick-btn { border-radius: 999px; }
    .typing {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 8px 12px;
      background: #fff;
      border-radius: 10px;
      border: 1px solid #e8eef7;
    }
    .typing span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #6c757d;
      animation: typingBounce 1.2s infinite ease-in-out;
    }
    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes typingBounce {
      0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
      40% { transform: translateY(-4px); opacity: 1; }
    }
    @media (max-width: 768px) {
      .chat-body { height: 62vh; min-height: 340px; }
      .bubble { max-width: 90%; }
    }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html"><i class="bi bi-shield-check me-2"></i>LIMS</a>
      <div class="ms-auto">
        <a class="btn btn-outline-light btn-sm" href="index.html">Back Home</a>
      </div>
    </div>
  </nav>

  <main class="container py-4 py-md-5">
    <div class="help-shell">
      <div class="mb-4 text-center">
        <h1 class="fw-bold mb-2">Help Center</h1>
        <p class="text-muted mb-0">AI-powered support for LIMS workflows, policies, and troubleshooting.</p>
      </div>

      <div class="card chat-card shadow-sm">
        <div class="card-header chat-header border-0 p-3 p-md-4">
          <div class="d-flex justify-content-between align-items-center gap-3 flex-wrap">
            <div>
              <h5 class="mb-1"><i class="bi bi-robot me-2"></i>LIMS Support Assistant</h5>
              <div class="small opacity-75">Ask only platform-related questions</div>
            </div>
            <button id="clearChatBtn" class="btn btn-light btn-sm">
              <i class="bi bi-trash3 me-1"></i>Clear Chat
            </button>
          </div>
        </div>

        <div id="chatBody" class="card-body chat-body p-3 p-md-4"></div>

        <div class="card-footer bg-white border-0 p-3 p-md-4">
          <div class="mb-3">
            <div class="small text-muted mb-2">Quick Questions</div>
            <div id="quickQuestions" class="d-flex flex-wrap gap-2"></div>
          </div>
          <div class="input-group">
            <textarea id="chatInput" class="form-control" rows="2" placeholder="Ask about matching, claims, coins, ratings, badges, account help, and more..."></textarea>
            <button id="sendBtn" class="btn btn-primary px-4">
              <i class="bi bi-send-fill"></i>
            </button>
          </div>
          <div class="small text-muted mt-2">Press Enter to send. Shift + Enter for a new line.</div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/ui.js"></script>
  <script>
    (function () {
      const STORAGE_KEY = "lims_help_center_chat_v1";
      const QUICK_QUESTIONS = [
        "How does matching work?",
        "How do I recharge coins?",
        "How do I claim an item?",
        "What are badges?",
        "How do ratings work?",
        "How do I reset my password?",
        "Why was my item rejected?"
      ];

      const chatBody = document.getElementById("chatBody");
      const chatInput = document.getElementById("chatInput");
      const sendBtn = document.getElementById("sendBtn");
      const clearChatBtn = document.getElementById("clearChatBtn");
      const quickQuestions = document.getElementById("quickQuestions");
      let isSending = false;
      let typingNode = null;
      let messages = [];

      function escapeHtml(value) {
        return String(value || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function formatText(text) {
        let html = escapeHtml(text);
        html = html.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
        html = html.replace(/`(.+?)`/g, "<code>$1</code>");
        html = html.replace(
          /(?:^|\n)([-*]\s.+(?:\n[-*]\s.+)*)/g,
          (block) => {
            const items = block
              .trim()
              .split("\n")
              .map((line) => line.replace(/^[-*]\s/, "").trim())
              .map((item) => `<li>${item}</li>`)
              .join("");
            return `<ul>${items}</ul>`;
          },
        );
        html = html.replace(
          /(?:^|\n)(\d+\.\s.+(?:\n\d+\.\s.+)*)/g,
          (block) => {
            const items = block
              .trim()
              .split("\n")
              .map((line) => line.replace(/^\d+\.\s/, "").trim())
              .map((item) => `<li>${item}</li>`)
              .join("");
            return `<ol>${items}</ol>`;
          },
        );
        html = html.replace(/\n/g, "<br>");
        return html;
      }

      function timeLabel(timestamp) {
        return new Date(timestamp).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
      }

      function saveMessages() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(messages.slice(-40)));
      }

      function loadMessages() {
        try {
          const stored = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
          messages = Array.isArray(stored) ? stored : [];
        } catch (error) {
          messages = [];
        }
        if (!messages.length) {
          messages.push({
            role: "assistant",
            text: "Welcome to LIMS Help Center. I can help with matching, claims, coins, wallet, ratings, badges, notifications, dashboard usage, privacy, terms, and account support.",
            at: Date.now()
          });
          saveMessages();
        }
      }

      function renderMessages() {
        chatBody.innerHTML = messages.map((msg) => `
          <div class="message-row ${msg.role === "user" ? "user" : ""}">
            <div class="bubble ${msg.role === "user" ? "user" : "assistant"}">
              <div>${formatText(msg.text)}</div>
              <div class="meta">${msg.role === "user" ? "You" : "LIMS AI"} · ${timeLabel(msg.at)}</div>
            </div>
          </div>
        `).join("");
        chatBody.scrollTop = chatBody.scrollHeight;
      }

      function setTyping(on) {
        if (on && !typingNode) {
          typingNode = document.createElement("div");
          typingNode.className = "message-row";
          typingNode.innerHTML = `<div class="typing"><span></span><span></span><span></span></div>`;
          chatBody.appendChild(typingNode);
          chatBody.scrollTop = chatBody.scrollHeight;
          return;
        }

        if (!on && typingNode) {
          typingNode.remove();
          typingNode = null;
        }
      }

      function pushMessage(role, text) {
        messages.push({ role, text, at: Date.now() });
        saveMessages();
        renderMessages();
      }

      async function sendMessage(rawText) {
        const text = String(rawText || "").trim().slice(0, 1000);
        if (!text || isSending) return;

        isSending = true;
        sendBtn.disabled = true;
        pushMessage("user", text);
        chatInput.value = "";
        setTyping(true);

        try {
          const response = await fetch("/api/chatbot", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message: text })
          });

          const data = await response.json();
          pushMessage("assistant", data.reply || "Sorry, I could not generate a response.");
        } catch (error) {
          pushMessage("assistant", "I am unable to connect right now. Please try again shortly.");
        } finally {
          setTyping(false);
          isSending = false;
          sendBtn.disabled = false;
          chatInput.focus();
        }
      }

      function renderQuickQuestions() {
        quickQuestions.innerHTML = QUICK_QUESTIONS.map((question) => `
          <button class="btn btn-outline-primary btn-sm quick-btn" data-q="${escapeHtml(question)}">${escapeHtml(question)}</button>
        `).join("");
      }

      sendBtn.addEventListener("click", function () {
        sendMessage(chatInput.value);
      });

      chatInput.addEventListener("keydown", function (event) {
        if (event.key === "Enter" && !event.shiftKey) {
          event.preventDefault();
          sendMessage(chatInput.value);
        }
      });

      quickQuestions.addEventListener("click", function (event) {
        const button = event.target.closest("button[data-q]");
        if (!button) return;
        sendMessage(button.getAttribute("data-q"));
      });

      clearChatBtn.addEventListener("click", function () {
        messages = [{
          role: "assistant",
          text: "Chat cleared. Ask any LIMS support question and I will help.",
          at: Date.now()
        }];
        saveMessages();
        renderMessages();
      });

      loadMessages();
      renderQuickQuestions();
      renderMessages();
    })();
  </script>
</body>
</html>
