<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Search Results | LIMS</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="container py-5">
        <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4">
            <div>
                <h2 class="mb-1">Search Results</h2>
                <p class="text-muted mb-0">Browse lost and found items with cleaner paging and better context.</p>
            </div>
            <a href="index.html" class="btn btn-outline-secondary">Back Home</a>
        </div>

        <div id="resultsSummary" class="mb-3 text-muted"></div>
        <div class="row g-4" id="resultsContainer"></div>
        <div id="pagination" class="d-flex justify-content-center gap-2 mt-4"></div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/ui.js"></script>

    <script>
        const params = new URLSearchParams(window.location.search);
        const q = params.get("q");
        const category = params.get("category");
        const locationId = params.get("location");
        const type = params.get("type");

        function buildQuery(page) {
            const query = new URLSearchParams();
            if (q) query.set("q", q);
            if (category) query.set("category", category);
            if (locationId) query.set("location", locationId);
            if (type) query.set("type", type);
            query.set("page", page);
            query.set("limit", 9);
            return query.toString();
        }

        function renderPagination(pagination) {
            if (!pagination || pagination.total_pages <= 1) {
                $("#pagination").html("");
                return;
            }

            let buttons = "";

            for (let page = 1; page <= pagination.total_pages; page += 1) {
                buttons += `
                    <button class="btn ${page === pagination.page ? "btn-primary" : "btn-outline-secondary"} pageBtn"
                        data-page="${page}">
                        ${page}
                    </button>`;
            }

            $("#pagination").html(buttons);
        }

        function loadResults(page = 1) {
            $("#resultsSummary").text("Loading results...");
            $("#resultsContainer").html(`
              <div class="col-12 text-center py-5 text-muted">
                <div class="spinner-border" role="status" aria-hidden="true"></div>
                <div class="mt-2">Loading items...</div>
              </div>
            `);
            $.get(window.location.origin + "/items?" + buildQuery(page), function (response) {
                const items = response.items || [];
                const pagination = response.pagination;

                if (!items.length) {
                    $("#resultsSummary").text("No items matched your filters.");
                    $("#resultsContainer").html("<div class='col-12'><div class='alert alert-light border'>No items found.</div></div>");
                    $("#pagination").html("");
                    return;
                }

                $("#resultsSummary").text(`Showing ${items.length} result(s) on page ${pagination.page} of ${pagination.total_pages}.`);

                const cards = items.map(item => {
                    const escapeHtml = window.LIMS_UI?.escapeHtml || (value => String(value ?? "")
                        .replace(/&/g, "&amp;")
                        .replace(/</g, "&lt;")
                        .replace(/>/g, "&gt;")
                        .replace(/\"/g, "&quot;")
                        .replace(/'/g, "&#39;"));
                    const image = item.image_url
                        ? window.location.origin + item.image_url
                        : "https://via.placeholder.com/400x220?text=Item";

                    const badge = item.item_type === "lost"
                        ? '<span class="badge bg-danger">Lost</span>'
                        : '<span class="badge bg-success">Found</span>';

                    return `
                        <div class="col-md-4">
                            <div class="card item-card shadow-sm border-0 h-100 clickable-item" data-id="${escapeHtml(item.id)}">
                                <img src="${escapeHtml(image)}" class="card-img-top" alt="Item image">
                                <div class="card-body d-flex flex-column">
                                    <div class="d-flex justify-content-between align-items-start gap-2 mb-2">
                                        <h5 class="mb-0 item-title-link">${escapeHtml(item.title)}</h5>
                                        ${badge}
                                    </div>
                                    <p class="text-muted small mb-2">${escapeHtml(item.category)} | ${escapeHtml(item.location)}</p>
                                    <div class="small mb-2">
                                        ${(window.LIMS_UI && window.LIMS_UI.renderUserBadge) ? window.LIMS_UI.renderUserBadge({
                                            full_name: item.reported_by,
                                            average_rating: item.reporter_average_rating,
                                            rating_count: item.reporter_rating_count,
                                            badges: item.reporter_badges || []
                                        }) : escapeHtml(item.reported_by)}
                                    </div>
                                    <p class="card-text flex-grow-1">${escapeHtml(item.description)}</p>
                                    <button class="btn btn-outline-primary btn-sm mt-2">Open Item</button>
                                </div>
                            </div>
                        </div>`;
                }).join("");

                $("#resultsContainer").html(cards);
                renderPagination(pagination);
            }).fail(function () {
                $("#resultsSummary").text("Failed to load results.");
                $("#resultsContainer").html("<div class='col-12'><div class='alert alert-danger'>Could not load items right now.</div></div>");
                $("#pagination").html("");
                if (window.LIMS_UI && window.LIMS_UI.showToast) {
                    window.LIMS_UI.showToast("Failed to load search results", "error");
                }
            });
        }

        $(document).on("click", ".clickable-item", function () {
            window.location.href = "item-details.html?id=" + $(this).data("id");
        });

        $(document).on("click", ".pageBtn", function () {
            loadResults($(this).data("page"));
        });

        loadResults();
    </script>

</body>

</html>
