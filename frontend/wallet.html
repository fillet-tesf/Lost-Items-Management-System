<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Wallet | LIMS</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/dashboard.css">
</head>

<body>
    <div class="container py-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="mb-1">Wallet</h2>
                <p class="text-muted mb-0">Manage your coin balance and recharge requests.</p>
            </div>
            <a href="user-dashboard.html" class="btn btn-outline-secondary">Back to Dashboard</a>
        </div>

        <div class="row g-3 mb-4">
            <div class="col-lg-4">
                <div class="card metric-card border-0 shadow-sm h-100">
                    <div class="card-body">
                        <div class="metric-label">Current Balance</div>
                        <div class="metric-value" id="walletBalance">0</div>
                        <div class="metric-note">Coins available for reporting lost items.</div>
                    </div>
                </div>
            </div>
            <div class="col-lg-8">
                <div class="card dashboard-panel border-0 shadow-sm h-100">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h5 class="mb-0">Recharge Coins</h5>
                            <i class="bi bi-wallet2 fs-4 text-primary"></i>
                        </div>
                        <div class="row g-3">
                            <div class="col-md-4">
                                <input id="rechargeCoins" class="form-control" type="number" min="1" placeholder="Coins">
                            </div>
                            <div class="col-md-4">
                                <select id="paymentMethod" class="form-select">
                                    <option value="">Payment Method</option>
                                    <option value="bank_transfer">Bank Transfer</option>
                                    <option value="mobile_money">Mobile Money</option>
                                    <option value="cash_deposit">Cash Deposit</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <input id="paymentReference" class="form-control" placeholder="Payment Reference">
                            </div>
                            <div class="col-12">
                                <button class="btn btn-primary" id="submitRecharge">Submit Recharge Request</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row g-3">
            <div class="col-lg-6">
                <div class="card dashboard-panel border-0 shadow-sm">
                    <div class="card-body">
                        <h5 class="mb-3">Recent Transactions</h5>
                        <div id="transactionsList" class="d-grid gap-2"></div>
                    </div>
                </div>
            </div>
            <div class="col-lg-6">
                <div class="card dashboard-panel border-0 shadow-sm">
                    <div class="card-body">
                        <h5 class="mb-3">Recharge Requests</h5>
                        <div id="requestsList" class="d-grid gap-2"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>
        const token = localStorage.getItem("token");

        function headers() {
            return { Authorization: "Bearer " + token };
        }

        function loadWallet() {
            $.ajax({
                url: window.location.origin + "/wallet",
                method: "GET",
                headers: headers(),
                success(data) {
                    $("#walletBalance").text((data.balance || 0) + " coins");

                    const transactions = (data.transactions || []).length
                        ? data.transactions.map(transaction => `
                            <div class="border rounded p-3">
                                <div class="d-flex justify-content-between">
                                    <strong>${transaction.type}</strong>
                                    <span>${transaction.amount} coins</span>
                                </div>
                                <div class="text-muted small">${transaction.reason}</div>
                            </div>
                        `).join("")
                        : "<div class='text-muted'>No transactions yet.</div>";

                    const requests = (data.payment_requests || []).length
                        ? data.payment_requests.map(request => `
                            <div class="border rounded p-3">
                                <div class="d-flex justify-content-between">
                                    <strong>${request.requested_coins} coins</strong>
                                    <span class="badge bg-secondary">${request.status}</span>
                                </div>
                                <div class="text-muted small">${request.payment_method} | ${request.payment_reference}</div>
                            </div>
                        `).join("")
                        : "<div class='text-muted'>No recharge requests yet.</div>";

                    $("#transactionsList").html(transactions);
                    $("#requestsList").html(requests);
                }
            });
        }

        $("#submitRecharge").on("click", function () {
            $.ajax({
                url: window.location.origin + "/payment-requests",
                method: "POST",
                contentType: "application/json",
                headers: headers(),
                data: JSON.stringify({
                    requested_coins: $("#rechargeCoins").val(),
                    payment_method: $("#paymentMethod").val(),
                    payment_reference: $("#paymentReference").val()
                }),
                success(res) {
                    alert(res.message);
                    $("#rechargeCoins").val("");
                    $("#paymentMethod").val("");
                    $("#paymentReference").val("");
                    loadWallet();
                },
                error(xhr) {
                    alert(xhr.responseJSON?.message || "Failed to submit request");
                }
            });
        });

        loadWallet();
    </script>
</body>

</html>
