<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Sign Up | LIMS</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- ========== NAVBAR ========== -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">LIMS</a>
        </div>
    </nav>

    <!-- ========== SIGNUP FORM ========== -->
    <div class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="card shadow p-4 signup-card">
            <h3 class="text-center mb-4">Create Account</h3>

            <form id="signUpForm" novalidate>
                <div class="mb-3">
                    <label class="form-label">Full Name</label>
                    <input id="fullName" type="text" class="form-control" placeholder="Enter full name">
                </div>

                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input id="email" type="email" class="form-control" placeholder="Enter email">
                </div>

                <div class="mb-3">
                    <label class="form-label">Phone Number</label>
                    <input id="phone" type="text" class="form-control" placeholder="Enter phone number">
                </div>

                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input id="password" type="password" class="form-control" placeholder="Create password">
                </div>

                <div class="mb-3">
                    <label class="form-label">Confirm Password</label>
                    <input id="confirmPassword" type="password" class="form-control" placeholder="Confirm password">
                </div>

                <div class="mb-3 form-check">
                    <input class="form-check-input" type="checkbox" id="agreeTerms">
                    <label class="form-check-label" for="agreeTerms">
                        I have read and agree to the
                        <a href="privacy-terms.html" target="_blank" rel="noopener noreferrer">Privacy Policy and Terms of Service</a>.
                    </label>
                </div>

                <div class="d-grid">
                    <button type="submit" id="signUpButton" class="btn btn-primary" disabled>Sign Up</button>
                </div>
            </form>

            <p class="text-center mt-3">
                Already have an account?
                <a href="login.html">Login</a>
            </p>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/jquery-4.0.0.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/main.js"></script>

</body>

</html>
